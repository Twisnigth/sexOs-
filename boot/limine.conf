# =============================================================================
#  boot/limine.conf -- Configuration du chargeur Limine pour MonOS
# -----------------------------------------------------------------------------
#  Une seule entrée, qui fonctionne aussi bien en UEFI qu'en BIOS legacy.
#  Limine charge le noyau ELF64 et lui fournit framebuffer + memory map + ACPI.
# =============================================================================

# Délai (secondes) avant démarrage automatique de l'entrée par défaut.
timeout: 3

# Interface graphique du menu Limine (utilise le framebuffer).
interface_branding: MonOS v2

/MonOS (64 bits, UEFI + BIOS)
    protocol: limine
    path: boot():/boot/kernel.elf
    # Binaire Linux statique chargé comme module (busybox).
    module_path: boot():/boot/busybox
